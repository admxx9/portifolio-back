services:
  appforge-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appforge}
      POSTGRES_USER: ${POSTGRES_USER:-appforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appforge}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - appforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appforge} -d ${POSTGRES_DB:-appforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  appforge-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-appforge}:${POSTGRES_PASSWORD:-appforge}@appforge-db:5432/${POSTGRES_DB:-appforge}
      APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      appforge-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  appforge_postgres_data:
